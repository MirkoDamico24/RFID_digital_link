<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elaborazione codice GS1...</title>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const path = window.location.pathname;
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const readPoint = urlParams.get('read_point');

            const parts = path.split('/01/');

            if (parts.length === 2) {
                
                const basePath = parts[0]; 
                
                // Estraiamo il GTIN
                const gtin = parts[1].split('/')[0]; 

                // Prepariamo il parametro da aggiungere all'URL
                // Usiamo encodeURIComponent per assicurarci che il valore sia formattato correttamente per gli URL
                const queryGtin = "?gtin=" + encodeURIComponent(gtin);

                // Logica di reindirizzamento: aggiungiamo queryGtin alla fine del file
                if (readPoint === 'reg') {
                    window.location.replace(basePath + '/pagina-registered.html' + queryGtin);
                } 
                else if (readPoint === 'ck') {
                    window.location.replace(basePath + '/hai-sbagliato.html' + queryGtin);
                } 
                else {
                    window.location.replace(basePath + '/pagina-default.html' + queryGtin); 
                }
            } 
            else {
                const repoBase = '/' + path.split('/')[1]; 
                window.location.replace(repoBase + '/'); 
            }
        });
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>Verifica in corso...</h2>
        <p>Stiamo elaborando le informazioni. Attendi un istante.</p>
    </div>
</body>
</html>
