<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errore prestito</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            color: #c62828;
            font-size: 3rem;
            margin-bottom: 30px;
        }

        .book-cover {
            width: 250px;
            height: 350px;
            margin: 0 auto 30px auto;
            border: 2px dashed #999;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            color: #777;
            font-size: 1rem;
        }

        p {
            font-size: 1.3rem;
            line-height: 1.6;
        }

        .book-title {
            font-weight: bold;
        }

        .author {
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hai sbagliato!</h1>

        <!-- Sostituire questo riquadro con l'immagine del libro -->
        <div class="book-cover">
            Copertina del libro
			<img src="copertina_libro.jpeg" class="book-cover">
        </div>

        <p>
            Il libro
            <span class="book-title">"RFID Handbook"</span>
            di
            <span class="author">Klaus Finkenzeller</span>
            non può essere preso in prestito.
        </p>
    </div>

</body>
</html>
