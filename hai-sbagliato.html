<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errore prestito</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            color: #c62828;
            font-size: 3rem;
            margin-bottom: 30px;
        }

        .book-cover {
            width: 250px;
            height: 350px;
            margin: 0 auto 30px auto;
            
            /* Le regole fondamentali per l'immagine */
            display: block; 
            object-fit: cover; 
            border-radius: 6px; 
            
            /* Assicuriamoci che non ci siano bordi o sfondi indesiderati */
            border: none; 
            background-color: transparent;
            
            /* Opzionale: aggiunge un'ombra elegante al libro */
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        p {
            font-size: 1.3rem;
            line-height: 1.6;
        }

        .book-title {
            font-weight: bold;
        }

        .author {
            font-style: italic;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Estraiamo il GTIN dall'URL
            const parametriUrl = new URLSearchParams(window.location.search);
            const gtinRicevuto = parametriUrl.get('gtin');

            // 2. Troviamo gli elementi nella pagina tramite il loro ID
            const imgElement = document.getElementById("immagine-dinamica");
            const titoloElement = document.getElementById("testo-titolo");
            const autoreElement = document.getElementById("testo-autore");

            if (gtinRicevuto) {
                
                // --- GESTIONE IMMAGINE ---
                const nomeFileImmagine = "img/" + gtinRicevuto + ".jpeg";

                imgElement.onerror = function() {
                    this.onerror = null; 
                    this.src = "img/immagine-non-trovata.jpeg"; 
                    this.alt = "Immagine non disponibile";
                };

                imgElement.src = nomeFileImmagine;
                imgElement.alt = "Immagine per il prodotto " + gtinRicevuto;
                
                // --- RECUPERO DATI DAL JSON ---
                fetch('dati-libri.json')
                    .then(response => {
                        if (!response.ok) throw new Error("Errore nel caricamento del file JSON");
                        return response.json();
                    })
                    .then(datiCatalogo => {
                        const infoLibro = datiCatalogo[gtinRicevuto];

                        if (infoLibro) {
                            // Iniettiamo titolo e autore!
                            titoloElement.textContent = infoLibro.titolo;
                            autoreElement.textContent = infoLibro.autore;
                        } else {
                            // Se il GTIN non è nel JSON
                            titoloElement.textContent = "Libro Sconosciuto";
                            autoreElement.textContent = "Autore Ignoto";
                        }
                    })
                    .catch(errore => {
                        console.error("Errore di rete/lettura JSON:", errore);
                        titoloElement.textContent = "Errore di caricamento";
                        autoreElement.textContent = "---";
                    });

            } else {
                // Se l'utente apre la pagina senza un GTIN nell'URL
                imgElement.src = "img/immagine-non-trovata.jpeg";
                imgElement.alt = "Nessun prodotto specificato";
                titoloElement.textContent = "Nessun prodotto";
                autoreElement.textContent = "Nessun autore";
            }
        });
    </script>
</head>

<body>

    <div class="container">
        <h1>Hai sbagliato!</h1>

        <img id="immagine-dinamica" src="img/caricamento.jpeg" class="book-cover" alt="Attendere...">        
        
        <p>
            Il libro
            "<span class="book-title" id="testo-titolo">Attendere...</span>"
            di
            <span class="author" id="testo-autore">Attendere...</span>
            non può essere preso in prestito.
        </p>
    </div>

</body>
</html>
