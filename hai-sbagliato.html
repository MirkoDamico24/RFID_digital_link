<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errore prestito</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            color: #c62828;
            font-size: 3rem;
            margin-bottom: 30px;
        }

	.book-cover {
		 width: 250px;
		height: 350px;
		margin: 0 auto 30px auto;
    
		/* Le regole fondamentali per l'immagine */
		display: block; 
		object-fit: cover; /* Fa sì che l'immagine riempia il riquadro 250x350 senza deformarsi */
		border-radius: 6px; /* Mantiene gli angoli leggermente arrotondati */
    
		/* Assicuriamoci che non ci siano bordi o sfondi indesiderati */
		border: none; 
		background-color: transparent;
    
		/* Opzionale: aggiunge un'ombra elegante al libro invece del vecchio bordo */
		box-shadow: 0 5px 15px rgba(0,0,0,0.2);
	}
        p {
            font-size: 1.3rem;
            line-height: 1.6;
        }

        .book-title {
            font-weight: bold;
        }

        .author {
            font-style: italic;
        }
    </style>
</head>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. Estraiamo il GTIN dall'URL (es: ?gtin=12345678901234)
        const parametriUrl = new URLSearchParams(window.location.search);
        const gtinRicevuto = parametriUrl.get('gtin');

        // 2. Troviamo l'elemento immagine nella pagina tramite il suo ID
        const imgElement = document.getElementById("immagine-dinamica");

        if (gtinRicevuto) {
            
            // 3. Costruiamo il nome del file basato sul GTIN
            // ATTENZIONE: Assicurati che l'estensione qui sotto (.jpeg, .jpg o .png) 
            // corrisponda esattamente a come salvi i file nella cartella!
            const nomeFileImmagine = "/img/" + gtinRicevuto + ".jpeg";

            // 4. (Opzionale ma super consigliato) Gestione degli errori
            // Se l'immagine per questo GTIN non esiste nella cartella, mostriamo un'immagine di default
            // per evitare il problema del "doppio frame" vuoto di cui parlavamo prima.
            imgElement.onerror = function() {
                this.onerror = null; // Previene loop infiniti se anche l'immagine di default manca
                this.src = "/img/immagine-non-trovata.jpeg"; // Assicurati di avere questa immagine di scorta
                this.alt = "Immagine non disponibile";
            };

            // 5. Applichiamo il nuovo percorso all'immagine
            imgElement.src = nomeFileImmagine;
            imgElement.alt = "Immagine per il prodotto " + gtinRicevuto;
            
        } else {
            // Cosa succede se l'utente apre la pagina senza un GTIN nell'URL?
            imgElement.src = "/img/immagine-non-trovata.jpeg";
            imgElement.alt = "Nessun prodotto specificato";
        }
    });
</script>

<body>

    <div class="container">
        <h1>Hai sbagliato!</h1>

        <!-- Sostituire questo riquadro con l'immagine del libro -->
		<img id="immagine-dinamica" src="caricamento.jpeg" class="book-cover">        <p>
            Il libro
            <span class="book-title">"RFID Handbook"</span>
            di
            <span class="author">Klaus Finkenzeller</span>
            non può essere preso in prestito.
        </p>
    </div>

</body>
</html>
